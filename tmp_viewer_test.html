<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>투구 포즈 시각화</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #fff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .panel { background: #1b1b1b; border-radius: 12px; padding: 12px; }
    canvas { width: 100%; height: auto; display: block; background: #000; border-radius: 8px; }
    .controls { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    button { border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    .badge { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>투구 포즈 시각화</h2>
      <canvas id="poseCanvas" width="160" height="120"></canvas>
      <div class="controls">
        <button id="playBtn">재생</button>
        <button id="pauseBtn">정지</button>
        <button id="stepBackBtn">◀</button>
        <button id="stepFwdBtn">▶</button>
        <span class="badge" id="statusLabel">0 / 3 프레임</span>
      </div>
    </div>
  </div>

    const fps = 10.0;
    const canvas = document.getElementById('poseCanvas');
    const ctx = canvas.getContext('2d');
    const statusLabel = document.getElementById('statusLabel');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stepBackBtn = document.getElementById('stepBackBtn');
    const stepFwdBtn = document.getElementById('stepFwdBtn');
    const images = frameSources.map(src => { const img = new Image(); img.src = src; return img; });
    let index = 0;
    let timer = null;

    function renderFrame() {
      if (!images.length) return;
      const img = images[index];
      if (img.complete) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      statusLabel.textContent = `${index + 1} / ${images.length} 프레임`;
    }

    function play() {
      if (!images.length) return;
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        index = (index + 1) % images.length;
        renderFrame();
      }, 1000 / fps);
    }

    function pause() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function step(delta) {
      if (!images.length) return;
      index = (index + delta + images.length) % images.length;
      renderFrame();
    }

    playBtn.addEventListener('click', play);
    pauseBtn.addEventListener('click', pause);
    stepBackBtn.addEventListener('click', () => step(-1));
    stepFwdBtn.addEventListener('click', () => step(1));

    renderFrame();
    play();
  </script>
</body>
</html>
